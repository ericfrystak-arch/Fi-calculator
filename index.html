<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FI Calculator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f4f6fc;--card:#ffffff;--line:#e2e7f3;--text:#1f2a4d;--muted:#6a7594;--faint:#8f99b5;--acc:#4b6bdb;--good:#4f9e2a;--track:#dfe5f4;--thumb:#ffffff;--tint:rgba(75,107,219,.06);--input:#f4f6fc;--shadow:0 1px 2px rgba(31,42,77,.06),0 4px 14px rgba(31,42,77,.05);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a33;--card:#1b2547;--line:#2c3866;--text:#eef1fb;--muted:#9aa6cc;--faint:#7783ab;--acc:#8aa2ff;--good:#8fd05a;--track:#2c3866;--thumb:#1b2547;--tint:rgba(138,162,255,.08);--input:#121a33;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a33;--card:#1b2547;--line:#2c3866;--text:#eef1fb;--muted:#9aa6cc;--faint:#7783ab;--acc:#8aa2ff;--good:#8fd05a;--track:#2c3866;--thumb:#1b2547;--tint:rgba(138,162,255,.08);--input:#121a33;--shadow:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:40px 20px 60px;min-height:100vh;font-variant-numeric:tabular-nums}
.w{max-width:740px;margin:0 auto}
.eyebrow{font-size:12px;color:var(--acc);letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:8px}
h1{font-size:clamp(26px,5vw,38px);color:var(--text);margin:0 0 8px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--acc)}
.sub{color:var(--muted);font-size:14px;margin:0 0 28px;line-height:1.6}
.ctl{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.lab{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.val{font-size:24px;color:var(--acc);font-weight:700}
.mm{display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--faint)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:4px;background:var(--track);outline:none;margin:12px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--thumb);border:3px solid var(--acc);box-shadow:0 2px 6px rgba(31,42,77,.25)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--thumb);border:3px solid var(--acc)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ent{display:flex;align-items:center;gap:6px}
.ent b{font-size:22px;color:var(--acc);font-weight:700}
.ent small{font-size:14px;color:var(--muted)}
.ent input{flex:1;min-width:0;width:100%;background:var(--input);border:2px solid var(--line);border-radius:10px;color:var(--text);font:600 22px 'Inter',system-ui,sans-serif;padding:8px 10px;outline:none}
.ent input:focus{border-color:var(--acc)}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px 20px;margin-bottom:20px;box-shadow:var(--shadow)}
.plot{display:flex}
.yax{display:flex;flex-direction:column-reverse;justify-content:space-between;height:260px;margin-right:10px;min-width:44px}
.yax div{font-size:11px;color:var(--faint);text-align:right;line-height:1}
.bars{flex:1;position:relative}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.bi{display:flex;gap:8px;align-items:flex-end;height:260px;position:relative}
.bc{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;cursor:pointer}
.bar{width:100%;position:relative;transition:height .5s cubic-bezier(.4,0,.2,1)}
.bar i{position:absolute;left:0;right:0;border-radius:6px 6px 0 0}
.xl{display:flex;margin-left:54px;gap:8px;margin-top:10px}
.xl div{flex:1;min-width:0;text-align:center;cursor:pointer}
.xl b{display:block;font-size:12px;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xl span{font-size:11px;color:var(--faint)}
.leg{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:20px;flex-wrap:wrap}
.leg div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.leg i{width:20px;height:10px;border-radius:3px;flex-shrink:0}
.card{border-radius:16px;padding:18px 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.card .lab{font-size:11px;margin-bottom:4px}
.card b{font-size:18px;font-weight:700}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow-x:auto;margin-bottom:24px;box-shadow:var(--shadow)}
.tr{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:6px;padding:12px 16px;font-size:13px;border-bottom:1px solid var(--line);min-width:420px;cursor:pointer}
.tr:last-child{border-bottom:none}
.tr.h{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600;cursor:default}
.tr span+span{text-align:right}
.foot{font-size:11px;color:var(--faint);text-align:center;margin-top:20px}
</style>
</head>
<body>
<div class="w">
  <div class="eyebrow">Financial Independence Analysis</div>
  <h1>Contribution Impact<span id="ttl"></span></h1>
  <p class="sub" id="sub"></p>

  <div class="ctl">
    <div class="box"><div class="row"><div class="lab">Current Age</div><div class="val" id="v-cur"></div></div>
      <input type="range" id="cur" min="5" max="80" step="1"><div class="mm"><span>Age 5</span><span>Age 80</span></div></div>
    <div class="box"><div class="row"><div class="lab">Retire Age</div><div class="val" id="v-ret"></div></div>
      <input type="range" id="ret" min="18" max="90" step="1"><div class="mm"><span>Age 18</span><span>Age 90</span></div></div>
    <div class="g2">
      <div class="box"><div class="lab" style="margin-bottom:12px">Starting Balance</div>
        <div class="ent"><b>$</b><input id="bal" type="text" inputmode="numeric"></div><div class="hint" id="h-bal"></div></div>
      <div class="box"><div class="lab" style="margin-bottom:12px">Monthly Contribution</div>
        <div class="ent"><b>$</b><input id="con" type="text" inputmode="numeric"><small>/mo</small></div><div class="hint" id="h-con"></div></div>
    </div>
    <div class="box"><div class="lab" style="margin-bottom:12px">Estimated Annual Expenses in Retirement</div>
      <div class="ent"><b>$</b><input id="exp" type="text" inputmode="numeric"><small>/yr</small></div><div class="hint" id="h-exp"></div></div>
    <div class="box"><div class="row"><div class="lab">Growth Rate</div><div class="val" id="v-rate"></div></div>
      <input type="range" id="rate" min="1" max="15" step="0.5"><div class="mm"><span>1%</span><span>15%</span></div></div>
  </div>

  <div class="chart">
    <div class="plot"><div class="yax" id="yax"></div><div class="bars"><div id="gl"></div><div class="bi" id="bi"></div></div></div>
    <div class="xl" id="xl"></div>
    <div class="leg">
      <div><i style="background:var(--track)"></i>Balance compounding (Coast FI floor)</div>
      <div><i style="background:var(--acc)"></i>Additional gain from contributions</div>
    </div>
  </div>

  <div id="card"></div>
  <div class="tbl" id="tbl"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
var COLORS=["#8a96b8","#5aa832","#4b6bdb","#e69a1f","#e0605f"], CH=260;
var s={cur:35,ret:65,bal:0,con:0,exp:0,rate:8,hover:null};
var $=function(id){return document.getElementById(id)};

function fv(b,m,rate,y){if(y<=0)return b;var r=rate/12,n=y*12,g=Math.pow(1+r,n);return b*g+(m>0?m*((g-1)/r):0)}
function fmt(n){if(n>=1e6)return "$"+(n/1e6).toFixed(2)+"M";if(n>=1e3)return "$"+Math.round(n).toLocaleString();return "$"+Math.round(n)}
function fmtShort(n){if(n>=1e6)return "$"+(n/1e6).toFixed(1)+"M";if(n>=1e3)return "$"+(n/1e3).toFixed(0)+"K";return "$"+Math.round(n)}
function fmtBal(v){if(v>=1e6)return "$"+(v/1e6).toFixed(2)+"M";if(v>=1e3)return "$"+(v/1e3).toFixed(1)+"K";return "$"+v}
function fmtCon(v){if(v===0)return "$0/mo";if(v>=1e3)return "$"+(v/1e3).toFixed(1)+"K/mo";return "$"+v+"/mo"}
function num(t){var n=Number(String(t).replace(/,/g,""));return isNaN(n)?null:Math.max(0,n)}

function render(){
  var years=Math.max(s.ret-s.cur,0), r=s.rate/100, b=s.con;
  var sc=[["$0/mo","Coast FI",0],[fmtCon(Math.round(b*.5)),"Half",b*.5],[fmtCon(b),"Base",b],[fmtCon(Math.round(b*1.5)),"1.5×",b*1.5],[fmtCon(b*2),"2×",b*2]]
    .map(function(x,i){return {label:x[0],sub:x[1],color:COLORS[i],value:fv(s.bal,x[2],r,years)}});
  var coast=sc[0].value, max=Math.max.apply(null,sc.map(function(x){return x.value})), gm=max*1.12||1;
  var gv=[0,1,2,3,4].map(function(i){return gm/4*i});

  $("ttl").textContent=" · Age "+s.cur+" → "+s.ret;
  $("sub").textContent=years+" years · "+s.rate+"% growth · "+fmtBal(s.bal)+" starting balance";
  $("v-cur").textContent="Age "+s.cur; $("v-ret").textContent="Age "+s.ret; $("v-rate").textContent=s.rate+"%";
  $("h-bal").textContent=fmtBal(s.bal); $("h-con").textContent=fmtCon(s.con);
  var fi=s.exp/.04;
  function swr(v){return fmt(v*.04)+"/yr"}
  $("h-exp").textContent="FI number: "+fmt(fi)+" (25× expenses, 4% rule)";
  $("foot").textContent="Not financial advice · "+s.rate+"% nominal annual growth · constant contributions · age "+s.cur+" today";

  $("yax").innerHTML=gv.map(function(v){return "<div>"+fmtShort(v)+"</div>"}).join("");
  $("gl").innerHTML=gv.map(function(v,i){return '<div class="gl" style="bottom:'+(v/gm*CH)+'px;'+(i===0?'border-top-color:var(--faint)':'')+'"></div>'}).join("");
  $("bi").innerHTML=sc.map(function(x,i){
    var tp=x.value/gm*100, cp=Math.min(coast/gm*100/(tp||1)*100,100), hv=s.hover===i;
    return '<div class="bc" data-i="'+i+'"><div class="bar" style="height:'+tp+'%">'
      +'<i style="bottom:0;height:'+cp+'%;background:'+x.color+'40"></i>'
      +(x.value>coast?'<i style="bottom:'+cp+'%;top:0;background:'+x.color+'"></i>':'')
      +'<i style="inset:0;border:1px solid '+(hv?x.color:'transparent')+';border-bottom:none;box-shadow:'+(hv?'0 0 14px '+x.color+'55':'none')+';pointer-events:none"></i>'
      +'</div></div>'}).join("");
  $("xl").innerHTML=sc.map(function(x,i){return '<div data-i="'+i+'"><b style="'+(s.hover===i?'color:'+x.color:'')+'">'+x.label+'</b><span>'+x.sub+'</span></div>'}).join("");

  var h=s.hover, c=$("card");
  if(h!==null){var x=sc[h];
    c.innerHTML='<div class="card" style="background:'+x.color+'18;border:1px solid '+x.color+'55">'
      +[["Final Value",fmt(x.value)],["vs Coast FI",x.value===coast?"—":"+"+fmt(x.value-coast)],["Annual SWR",swr(x.value)]]
      .map(function(p){return '<div><div class="lab">'+p[0]+'</div><b style="color:'+x.color+'">'+p[1]+'</b></div>'}).join("")+'</div>';
  } else c.innerHTML="";

  $("tbl").innerHTML='<div class="tr h"><span>Scenario</span><span>Final Value</span><span>vs Coast FI</span><span>Annual SWR</span></div>'
    +sc.map(function(x,i){var d=x.value-coast;
      return '<div class="tr" data-i="'+i+'" style="'+(h===i?'background:var(--tint)':'')+'"><span style="color:'+x.color+'">'+x.sub+' · '+x.label+'</span>'
      +'<span>'+fmt(x.value)+'</span><span style="color:'+(d===0?'var(--faint)':'var(--good)')+'">'+(d===0?"—":"+"+fmt(d))+'</span><span style="color:'+(fi>0&&x.value>=fi?'var(--good)':'var(--muted)')+'">'+swr(x.value)+'</span></div>'}).join("");
}

function pick(e){var t=e.target.closest("[data-i]");if(!t)return;var i=+t.getAttribute("data-i");s.hover=s.hover===i?null:i;render()}
["bi","xl","tbl"].forEach(function(id){$(id).addEventListener("click",pick)});

[["cur","cur"],["ret","ret"],["rate","rate"]].forEach(function(p){
  var el=$(p[0]); el.value=s[p[1]];
  el.addEventListener("input",function(){s[p[1]]=Number(el.value);render()});
});
function wire(id,key,max){
  var el=$(id); el.value=s[key]?s[key].toLocaleString("en-US"):"";
  el.addEventListener("input",function(){
    var pos=el.selectionStart, before=el.value.slice(0,pos).replace(/\D/g,"").length;
    var digits=el.value.replace(/\D/g,"").replace(/^0+(?=\d)/,"");
    var n=digits===""?0:Math.min(Number(digits),max);
    el.value=digits===""?"":n.toLocaleString("en-US");
    var total=el.value.replace(/\D/g,"").length; before=Math.min(before,total);
    var c=0,i=0; while(i<el.value.length&&c<before){if(/\d/.test(el.value.charAt(i)))c++;i++}
    try{el.setSelectionRange(i,i)}catch(e){}
    s[key]=n; render();
  });
  el.addEventListener("blur",function(){el.value=s[key].toLocaleString("en-US")});
}
wire("bal","bal",10000000); wire("con","con",1000000); wire("exp","exp",10000000);
render();
</script>
</body>
</html>
